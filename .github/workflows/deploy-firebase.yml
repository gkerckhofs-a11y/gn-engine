name: Déployer GN Engine sur Firebase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/deploy-request.json']

permissions:
  contents: read

concurrency:
  group: gn-engine-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'gkerckhofs-a11y/gn-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run test:emulator

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '>= 530.0.0'

      - name: Identité temporaire pour la fonction
        id: cloud-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: gn-engine
          workload_identity_provider: projects/936415509528/locations/global/workloadIdentityPools/gn-engine-github/providers/gn-engine-main
          service_account: gn-engine-deployer@gn-engine.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
      - name: Publier la fonction en Belgique
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.cloud-auth.outputs.access_token }}
        run: bash scripts/deploy-api.sh

      # Nouvelle identité après la compilation distante (qui peut dépasser 5 min).
      - name: Identité temporaire pour Firebase
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: gn-engine
          workload_identity_provider: projects/936415509528/locations/global/workloadIdentityPools/gn-engine-github/providers/gn-engine-main
          service_account: gn-engine-deployer@gn-engine.iam.gserviceaccount.com
          create_credentials_file: true
      - name: Publier les règles, index et site
        run: npx firebase deploy --project gn-engine --only firestore:rules,firestore:indexes,hosting --non-interactive
      - name: Vérifier le site et son API
        run: node scripts/verify-deployment.mjs
