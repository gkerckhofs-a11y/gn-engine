name: Déployer GN Engine sur Firebase

on:
  workflow_dispatch:
    inputs:
      target:
        description: Site à publier
        required: false
        type: choice
        default: gn-engine
        options: [gn-engine, holopedia]
  push:
    branches: [main]
    paths: ['.github/deploy-request.json', '.github/holopedia-request.json']

permissions:
  contents: read
  actions: read

concurrency:
  group: gn-engine-production
  cancel-in-progress: false

jobs:
  determine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.select.outputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Sélectionner le site sans incidence sur l'application principale
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED_TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
        run: |
          target="${REQUESTED_TARGET:-gn-engine}"
          if [[ "$EVENT" == "push" ]]; then
            if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Fxq '.github/holopedia-request.json'; then
              target=holopedia
            else
              target=gn-engine
            fi
          fi
          if [[ "$target" != "gn-engine" && "$target" != "holopedia" ]]; then
            echo "Cible de publication inconnue" >&2
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
  verify:
    needs: determine
    # Autorisation de Guillaume : publier une fois les modifications finalisées.
    if: ${{ github.ref == 'refs/heads/main' && needs.determine.outputs.target == 'gn-engine' }}
    runs-on: ubuntu-latest
    # La CI Firestore complète peut dépasser 30 min ; conserver tous ses contrôles.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Attendre la CI complète du commit publié
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/await-release-ci.mjs

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && needs.determine.outputs.target == 'gn-engine' }}
    needs: [determine, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '>= 530.0.0'

      - name: Identité temporaire pour la fonction
        id: cloud-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: gn-engine
          workload_identity_provider: projects/936415509528/locations/global/workloadIdentityPools/gn-engine-github/providers/gn-engine-main
          service_account: gn-engine-deployer@gn-engine.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
      - name: Publier la fonction en Belgique
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.cloud-auth.outputs.access_token }}
        run: bash scripts/deploy-api.sh

      # Nouvelle identité après la compilation distante (qui peut dépasser 5 min).
      - name: Identité temporaire pour Firebase
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: gn-engine
          workload_identity_provider: projects/936415509528/locations/global/workloadIdentityPools/gn-engine-github/providers/gn-engine-main
          service_account: gn-engine-deployer@gn-engine.iam.gserviceaccount.com
          create_credentials_file: true
      - name: Publier les règles, index et site
        run: npx firebase deploy --project gn-engine --only firestore:rules,firestore:indexes,hosting --non-interactive
      - name: Vérifier le site et son API
        run: node scripts/verify-deployment.mjs

  deploy-holopedia:
    if: ${{ github.ref == 'refs/heads/main' && needs.determine.outputs.target == 'holopedia' }}
    needs: determine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Contenus publics de la branche indépendante
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Vérifier la publication Holopédia uniquement
        run: |
          test -f firebase.holopedia.json
          test -f index.html
          test -f world-encyclopedia-data.mjs
          grep -q 'HOLOPÉDIA' index.html
          grep -q 'planete-corellia' world-encyclopedia-data.mjs
      - name: Tests ciblés des hyperliens publics
        run: node --test test/world-encyclopedia-links.test.mjs
      - name: Installer Firebase CLI
        run: npm install --global firebase-tools@15.34.0 --no-audit --no-fund
      - name: Identité Google déjà autorisée pour le workflow de production
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: gn-engine
          workload_identity_provider: projects/936415509528/locations/global/workloadIdentityPools/gn-engine-github/providers/gn-engine-main
          service_account: gn-engine-deployer@gn-engine.iam.gserviceaccount.com
          create_credentials_file: true
      - name: Créer le site Hosting secondaire sans toucher au site principal
        env:
          SITE_ID: holopedia-space-outlaws
        run: |
          if firebase hosting:sites:get "$SITE_ID" --project gn-engine --non-interactive >/dev/null 2>&1; then
            echo "Site secondaire existant"
          else
            firebase hosting:sites:create "$SITE_ID" --project gn-engine --non-interactive
          fi
      - name: Autoriser l'accès temporaire aux illustrations en lecture seule
        id: drive-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: gn-engine
          workload_identity_provider: projects/936415509528/locations/global/workloadIdentityPools/gn-engine-github/providers/gn-engine-main
          service_account: gn-engine-deployer@gn-engine.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: Importer et optimiser les vues planétaires
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.drive-auth.outputs.access_token }}
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 assets-source/download-planets.py
      - name: Restaurer l'identité Firebase pour la publication
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: gn-engine
          workload_identity_provider: projects/936415509528/locations/global/workloadIdentityPools/gn-engine-github/providers/gn-engine-main
          service_account: gn-engine-deployer@gn-engine.iam.gserviceaccount.com
          create_credentials_file: true
      - name: Publier exclusivement l'Holopédia
        env:
          SITE_ID: holopedia-space-outlaws
        run: |
          firebase target:apply hosting holopedia "$SITE_ID" --project gn-engine
          firebase deploy --project gn-engine --only hosting:holopedia --config firebase.holopedia.json --non-interactive
      - name: Vérifier l'adresse publique de l'encyclopédie
        run: |
          curl --fail --location --retry 5 --retry-delay 3 --silent --show-error "https://holopedia-space-outlaws.web.app/" | grep -q 'HOLOPÉDIA'
