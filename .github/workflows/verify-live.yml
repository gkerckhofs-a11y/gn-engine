name: Vérifier la version publiée de GN Engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/verify-deployment.mjs
      - scripts/deployment-checks.mjs
      - .github/workflows/verify-live.yml
permissions:
  contents: read
jobs:
  verify-live:
    if: github.repository == 'gkerckhofs-a11y/gn-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test test/deployment-checks.test.mjs
      - run: node scripts/verify-deployment.mjs
# Read-only HTTP checks. No Google credentials and no deployment.
