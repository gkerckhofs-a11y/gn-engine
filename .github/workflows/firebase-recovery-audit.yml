name: Auditer les sauvegardes Firebase (lecture seule)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gn-engine-recovery-audit
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'gkerckhofs-a11y/gn-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: gn-engine
          workload_identity_provider: projects/936415509528/locations/global/workloadIdentityPools/gn-engine-github/providers/gn-engine-main
          service_account: gn-engine-deployer@gn-engine.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '>= 530.0.0'
      - name: Lire les ressources, sans écriture cloud
        env:
          GCLOUD_PROJECT: gn-engine
          GN_FIREBASE_RECOVERY_REPORT: ${{ runner.temp }}/firebase-recovery-readonly.json
        run: node scripts/audit-firebase-recovery.mjs
      - name: Conserver le constat technique sans données de joueurs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-recovery-readonly
          path: ${{ runner.temp }}/firebase-recovery-readonly.json
          retention-days: 7
          if-no-files-found: warn
