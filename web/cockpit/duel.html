<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STARFIGHTER · Vol en patrouille</title>

*{box-sizing:border-box}body{margin:0;background:#081015;color:#d4e5e2;font:16px system-ui}main{max-width:1280px;margin:auto;padding:2vw}header,.row,.instruments{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{border-bottom:1px solid #687879}h1{font-size:clamp(20px,4vw,36px);letter-spacing:.12em;margin:.4em 0}output,b{color:#8defcf}figure{position:relative;margin:12px 0 0;background:#040910;border:5px ridge #52616a;border-radius:20% 20% 8px 8px / 8% 8% 8px 8px;overflow:hidden}canvas{display:block;width:100%;height:clamp(280px,53vh,650px)}video{position:absolute;right:4%;bottom:6%;width:24%;border:2px solid #84bcac;background:#081915}section{padding:14px;background:linear-gradient(165deg,#334149,#142028 60%,#243038);border:1px solid #53656a;border-radius:7px;margin-top:8px}article{flex:1;background:#071819;border:3px inset #566166;border-radius:6px;padding:8px 12px;min-width:100px}small{display:block;color:#9eafad;letter-spacing:.08em}output{font: bold 1.15rem monospace}button,select{background:#263b41;color:#f1ffe9;border:2px outset #819190;padding:.6em;border-radius:4px;font:inherit;cursor:pointer}button:active{border-style:inset}button:disabled{opacity:.5}#break{background:#613d2d}details{margin-top:12px}summary{cursor:pointer}p{line-height:1.55}.keys{color:#b4c7c7}label{display:inline-block;margin:.4em}button:focus-visible,select:focus-visible{outline:3px solid #f4cb76}
